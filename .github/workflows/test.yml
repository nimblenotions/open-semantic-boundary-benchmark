name: test

on:
  push:
    branches: [main, cikm-2026, feature/*]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: make lint
      - run: make test
      - run: make repro-cikm-2026
      - run: make repro-smoke
